name: Build Unogram (ARM appx)

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The project targets SDK 10.0.15063 (the newest one that exists on a
      # Windows 10 Mobile 1703/1709 device) and builds ARM with .NET Native, so
      # the runner needs that SDK and the ARM C++ tools added to Visual Studio.
      - name: Install Windows SDK 15063
        shell: pwsh
        run: |
          $ok = Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP\10.0.15063.0"
          if (-not $ok) {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?linkid=845298' -OutFile sdk15063.exe
            Write-Host "::notice::sdk downloaded: $((Get-Item sdk15063.exe).Length) bytes"
            $p = Start-Process -FilePath .\sdk15063.exe -ArgumentList '/quiet','/norestart','/features','+' -Wait -PassThru
            Write-Host "::notice::sdk installer exit code: $($p.ExitCode)"
          }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::notice::UAP platform: $($_.Name)" }

      - name: Create Secrets.cs
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          $id = $env:TG_API_ID
          $hash = $env:TG_API_HASH
          if ([string]::IsNullOrWhiteSpace($id) -or [string]::IsNullOrWhiteSpace($hash)) {
            Write-Host "::warning::TG_API_ID / TG_API_HASH secrets are not set - building with placeholders (app will compile but cannot log in)"
            $id = '0'; $hash = ''
          }
          $src = Get-Content Secrets.cs.template -Raw
          $src = $src -replace 'ApiId = 0;', "ApiId = $id;"
          $src = $src -replace 'ApiHash = "";', "ApiHash = `"$hash`";"
          Set-Content -Path Secrets.cs -Value $src -Encoding UTF8

      - name: NuGet restore
        run: nuget restore Unogram.sln

      - name: Build (Release | ARM)
        shell: pwsh
        run: |
          msbuild Unogram.sln /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Never /v:m /m "/flp:logfile=build.log;verbosity=normal" "/flp1:logfile=errors.log;errorsonly;verbosity=quiet"
          $code = $LASTEXITCODE
          if (Test-Path errors.log) {
            Get-Content errors.log | Select-Object -Unique | Select-Object -First 15 | ForEach-Object {
              $m = ($_ -replace '[\r\n%]', ' ')
              if ($m.Length -gt 900) { $m = $m.Substring(0,900) }
              Write-Host "::error::$m"
            }
          }
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            errors.log
          if-no-files-found: ignore

      - name: Collect packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse -Include *.appx,*.cer -Path TelegramWP10 | Where-Object { $_.FullName -match 'AppPackages' } | ForEach-Object { Copy-Item $_.FullName out/ ; Write-Host $_.FullName }
          Get-ChildItem -Recurse -Path TelegramWP10 -Filter 'Microsoft.VCLibs*.appx' | ForEach-Object { Copy-Item $_.FullName out/ -ErrorAction SilentlyContinue }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Unogram-ARM-appx
          path: out/*
          if-no-files-found: warn
